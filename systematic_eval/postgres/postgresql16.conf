# PostgreSQL 16 configuration for pg_lab benchmarking (c06-class host).
# Source: ldb_wlexecutor/conf/postgresql16.conf (DataManagementLab).
#
# Environment-specific paths (data_directory, hba_file, ident_file,
# external_pid_file, unix_socket_directories, cluster_name) are commented
# out below so this file can be bind-mounted into the pg_lab Docker
# container without clashing with the image's internal layout. Uncomment
# them on a bare-metal install.

# ---- Parallelism: disabled for deterministic single-core benchmarking ----
max_worker_processes = 0
max_parallel_workers_per_gather = 0
max_parallel_workers = 0

# ---- Memory sizing (tuned for ~256 GB host) ----
shared_buffers = 32GB
effective_cache_size = 189GB
maintenance_work_mem = 2GB
wal_buffers = 16MB
temp_buffers = 32GB
work_mem = 300MB

# ---- WAL / checkpoints ----
checkpoint_completion_target = 0.9
min_wal_size = 4GB
max_wal_size = 16GB

# ---- I/O ----
effective_io_concurrency = 2
# random_page_cost is NOT set here: leaving it unset yields postgres' default (4.0).
# Set it per experiment instead, via `execution.postgres_random_page_cost` in the
# config YAML (controller.sh forwards it as `pg_lab_setup.py --set random_page_cost=...`,
# which is applied after this file and overrides it). Do not re-add it here — that
# would give the setting two competing sources.
# Context: the default 4 assumes random access ~4x slower than sequential; on SSD the
# gap is much smaller, so a lower value (e.g. 1.1) biases the planner toward index scans.

# ---- Paths (commented out: supplied by the container / pg_lab_setup.py) ----
#data_directory = '/var/lib/postgresql/16/main'
#hba_file = '/etc/postgresql/16/main/pg_hba.conf'
#ident_file = '/etc/postgresql/16/main/pg_ident.conf'
#external_pid_file = '/var/run/postgresql/16-main.pid'
#unix_socket_directories = '/var/run/postgresql'
#cluster_name = '16/main'

# ---- Connections ----
listen_addresses = '*'
port = 5432
max_connections = 500

# ---- Planner: deterministic, disables non-essential access methods ----
enable_bitmapscan = off
enable_tidscan = off
enable_memoize = off
geqo = off

# ---- Logging (keeps hint-plan debug output visible) ----
log_statement = 'all'
log_timezone = 'Europe/Berlin'
log_connections = on
client_min_messages = log
pg_hint_plan.debug_print = detailed

# ---- Locale / i18n ----
datestyle = 'iso, mdy'
timezone = 'Europe/Berlin'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'

# ---- Extensions: pg_hint_plan (pg_lab piggy-backs on its loader) ----
shared_preload_libraries = 'pg_hint_plan'
